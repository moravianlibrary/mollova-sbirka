<div class="app-container" *ngIf="collectionStructure$ | async as collectionStructure; else loading">
    <div class="app-navs">
        <div class="app-nav" *ngFor="let col of collectionStructure">
            <!-- PRVNI UROVEN -->
            <h5 class="app-nav-1" *ngIf="currentLang === 'cs'">{{col['title']}}</h5>
            <h5 class="app-nav-1" *ngIf="currentLang === 'en'">{{col['title_en']}}</h5>
            <h5 class="app-nav-1" *ngIf="currentLang === 'de'">{{col['title_de']}}</h5>
            <!-- DRUHA UROVEN -->
            <div class="app-nav-2" *ngFor="let item of col['children']">
                <div class="app-nav-2-item" [class.highlight]="item.title === hoveredArea" [class.app-active]="item.title === openedChild"
                    (mouseover)="onMenuMouseEnter(item.title)"
                    (mouseout)="onMenuMouseLeave()"
                    (click)="handleClick(item)">
                    <div class="app-nav-2-icon" 
                        (mouseover)="onIconHover(item.title)" 
                        (mouseout)="onIconLeave()" 
                        (click)="openedChild !== item['title'] ? onOpenChild(item['title']) : onCloseChild(item['title']); $event.stopPropagation()">
                        <img [src]="hoveredIcon === item.title ? './assets/icons/minus-circle.png' : (openedChild === item['title'] ? './assets/icons/minus-circle.png' : './assets/icons/add-circle.png')" 
                            alt="Icon" />
                    </div>
                    <div class="app-nav-2-text" *ngIf="currentLang === 'cs'" [class.app-active]="item['title'] === activeChild">{{item['title']}}</div>
                    <div class="app-nav-2-text" *ngIf="currentLang === 'en'" [class.app-active]="item['title'] === activeChild">{{item['title_en']}}</div>
                    <div class="app-nav-2-text" *ngIf="currentLang === 'de'" [class.app-active]="item['title'] === activeChild">{{item['title_de']}}</div>
                </div>
                <!-- TRETI UROVEN -->
                <div class="app-nav-3" *ngIf="openedChild === item['title']" >
                    <div class="app-nav-3-item" *ngFor="let child of childrenExtended ? item['children'] : item['children'].slice(0, 5)"
                        (click)="handleClick(child); $event.stopPropagation()">
                        <div class="app-nav-3-text" *ngIf="currentLang === 'cs'" [class.app-active]="child['title'] === activeChild">{{child['title']}}</div>
                        <div class="app-nav-3-text" *ngIf="currentLang === 'de'" [class.app-active]="child['title'] === activeChild">{{child['title_de']}}</div>
                        <div class="app-nav-3-text" *ngIf="currentLang === 'en'" [class.app-active]="child['title'] === activeChild">{{child['title_en']}}</div>
                    </div>
                    <div class="app-nav-3-item app-extend" *ngIf="item.children.length > 5 && !childrenExtended" (click)="extendChildren()">    
                        <div class="app-nav-3-icon" 
                        (mouseover)="onIconHover(item.title)" 
                        (mouseout)="onIconLeave()" 
                        (click)="extendChildren()">
                            <img [src]="'assets/icons/arrow-down-small-black.png'" alt="Icon" />
                        </div>
                        <div class="app-nav-3-text app-extend-text">{{'other' | translate}} ({{item.children.length - 5}})</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<ng-template class="app-loading" #loading>
    <p>{{'loading-structure' | translate}}</p>
</ng-template>
