<div class="app-container" *ngIf="collection">
    <div class="app-content">
        <div class="app-title">
            <h1>{{getTitle()}}</h1>
            <div class="text-base">{{getDescription()}}</div>
        </div>
        <div class="app-cards">
            <div class="app-cards-row" *ngIf="children && children.length > 0">
                <div class="app-card" *ngFor="let item of children">
                    <a class="app-card-image" [routerLink]="['/mollova-sbirka', item.pid]">
                        <div class="app-card-overlay"></div>
                        <img [src]="getChildrenImage(item)" alt="Image" />
                    </a>
                    <div class="app-card-content">
                        <a class="app-card-title-container" [routerLink]="['/mollova-sbirka', item.pid]">
                            <h5 class="app-card-title" 
                                [matTooltip]="getChildrenTitle(item)">
                                {{getChildrenTitle(item)}}
                            </h5>
                            <img class="app-card-icon default-icon" src="assets/icons/arrow.png">
                            <img class="app-card-icon hover-icon" src="assets/icons/arrow-gold.png">
                        </a>
                        <div class="app-card-text">{{getChildrenDescription(item)}}</div>
                        <div class="app-card-sign">{{'old_signature' | translate}}:</div>
                        <div *ngIf="item?.shelf_locators?.[0]" class="app-card-sign">{{'new_signature' | translate}}: {{item.shelf_locators[0]}}</div>
                        <!-- <div class="app-card-link">
                            <div class="app-card-link-text">Mollův katalog 1</div>
                            <img class="app-card-link-icon default-icon" src="assets/icons/export.png" width="">
                            <img class="app-card-link-icon hover-icon" src="assets/icons/export-gold.png" width="">
                        </div> -->
                    </div>
                </div>
            </div>
            <div class="app-children-loading" *ngIf="!children || children.length === 0">
                <mat-spinner></mat-spinner>
            </div>
        </div>
    </div>
</div>
