<div class="app-container" *ngIf="!loading">
    <div class="app-content" #scrollContainer>
        <div class="app-part-title">
            <h2 class="app-title">{{map['title.search']}}</h2>
            <div class="app-authors">{{map['authors']}}</div>
        </div>
        <div class="app-part-map" #mapDiv>
            <div class="app-map">
                <app-iiif-image-viewer [infoJsonUrl]="manifestLink"></app-iiif-image-viewer>
            </div>
            <!-- <div class="app-map-actions">
                <div class="app-buttons">
                    <div class="app-button">
                        <img src="assets/icons/zoom-in.png" alt="zoom in" />
                    </div>
                    <div class="app-button">
                        <img src="assets/icons/zoom-out.png" alt="zoom out" />
                    </div>
                </div>
                <div class="app-button">
                    <img src="assets/icons/maximize.png" alt="arrow left" />
                </div>
                <div class="app-button">
                    <img src="assets/icons/download.png" alt="arrow right" />
                </div>
            </div> -->
        </div>
        <div class="app-part-info" #infoDiv>
            <div class="app-metadata-container">
                <div class="app-metadata">
                    <div class="app-metadata-item" *ngIf="map['authors']">
                        {{ getAuthors() }}
                    </div>
                    <div class="app-metadata-item">
                        {{getPublishersData()}}
                    </div>
                    <div class="app-metadata-item">
                        {{getGeographicNames()}}
                    </div>
                    <div class="app-metadata-item">
                        {{getNewShelfLocator()}}
                    </div>
                </div>
            </div>
            <div class="app-other-info">
                <div class="app-text" *ngFor="let title of this.map['titles.search']">{{title}}</div>
                <div class="app-line"></div>
                <div class="app-links">
                    <!-- <a class="app-link" href="" target="_blank">
                        <div class="app-link-text">{{'bibl-rec' | translate}}</div>
                        <img src="assets/icons/export-gold.png" alt="export" />
                    </a> -->
                    <a class="app-link" href="https://www.digitalniknihovna.cz/mzk/uuid/{{map['pid']}}" target="_blank">
                        <div class="app-link-text">{{'dk-link' | translate}}</div>
                        <img src="assets/icons/export-gold.png" alt="export" />
                    </a>
                </div>
            </div>

        </div>
    </div>
    <div class="app-bottom-nav">
        <div class="app-nav-button" (click)="scrollTo(showMoreInfo ? 'map' : 'info')">
            <div class="app-text">{{ showMoreInfo ? 'Zpět na mapu' : 'Více informací' }}</div>
            <img class="app-icon" [src]="showMoreInfo ? 'assets/icons/arrow-up.png' : 'assets/icons/arrow-down.png'" alt="arrow" />
        </div>
        <div class="app-right-nav">
            <div class="app-text">{{ 'other-maps' | translate }}</div>
            <div class="app-pagination">
                <div class="app-icons">
                    <div class="app-button">
                        <img src="assets/icons/arrow-left-inactive.png" alt="arrow left" />
                    </div>
                    <div class="app-button">
                        <img src="assets/icons/arrow-right.png" alt="arrow right" />
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
