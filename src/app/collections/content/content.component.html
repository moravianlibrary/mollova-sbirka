<div class="app-container" *ngIf="!loading">
    <div *ngIf="typeOfResource === 'collection'">
        <app-collection [collection]="collection" [children]="children" [lang]="currentLang"></app-collection>
    </div>
    <div *ngIf="typeOfResource === 'map'">
        <app-map [map]="map" [parentCollection]="collection" [siblings]="children"></app-map>
    </div>
</div>
<div class="app-loading" *ngIf="loading">
    <mat-spinner></mat-spinner>
</div>
