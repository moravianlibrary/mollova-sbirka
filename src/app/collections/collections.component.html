        <svg
            viewBox="0 0 1500 1290"
            xmlns="http://www.w3.org/2000/svg"
            class="interactive-map"
            >
            <!-- Podkladový obrázek -->
            <image class="app-map-image" 
                   href="assets/images/mapa.jpg" 
                   width="1500" 
                   height="1290"
                   filter="url(#grayscale-filter)"
                   />
            <filter id="shadow">
                <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="black" />
            </filter>
            <filter id="grayscale-filter">
                <feColorMatrix type="saturate" values="0" />
            </filter>

            <!-- Definice polygonů-->
            <ng-container *ngFor="let area of mapAreas2">
                <polygon
                [attr.points]="area.points"
                class="map-area"
                [class.highlight]="shouldHighlight(area.title)"
                (click)="navigate(area.title)"
                (mouseover)="onMouseEnter(area.title)"
                (mouseout)="onMouseLeave(area.title)"
                >
                <title>{{ area.title }}</title>
                </polygon>
            </ng-container>
        </svg>
    </div>
    <div class="app-content" *ngIf="!map" [class.app-visible]="!menuVisible">
        <app-content></app-content>
    </div>
</div>
