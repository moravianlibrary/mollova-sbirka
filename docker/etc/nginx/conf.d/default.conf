map $uri $redirect_target {
    default "";
    include /etc/nginx/conf.d/redirects.map;
}

server {
    listen 80;
    server_name localhost _;

    root /usr/share/nginx/html;

    # 🔥 0) canonical hostname: www.* a old.* redirectovat na root doménu
    if ($host ~* ^(?:www|old)\.(?<root_domain>.+)$) {
        return 302 https://$root_domain$request_uri; # Use 302 for temporary redirects if appropriate in production
    }

    # 🔥 1) globální odstranění trailing slash (kromě "/")
    location ~ ^(?<path_without_trailing_slash>.+)/$ {
        return 302 https://$host$path_without_trailing_slash$is_args$args; # Use 302 for temporary redirects if appropriate in production
    }

    location / {
        # 🔥 2) explicitní redirecty na uuid
        if ($redirect_target) {
            return 302 $redirect_target$is_args$args; # Use 302 for temporary redirects if appropriate in production
        }

        # 🔥 3) Angular fallback
        try_files $uri $uri/ /index.html;
    }
}