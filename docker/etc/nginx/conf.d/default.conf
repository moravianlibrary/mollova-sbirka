map $uri $redirect_target {
    default "";
    include /etc/nginx/conf.d/redirects.map;
}

# 🔥 0) canonical hostname: www.* a old.* redirectovat na root doménu
server {
    listen 80;
    server_name ~^(www|old)\.(?<root_domain>.+)$;

    return 302 $scheme://$root_domain$request_uri; # Use 301 for permanent redirects if appropriate in production
}

server {
    listen 80;
    server_name localhost _;

    root /usr/share/nginx/html;

    # 🔥 1) globální odstranění trailing slash (kromě "/")
    location ~ ^(.+)/$ {
        return 302 $scheme://$host$1$is_args$args; # Use 301 for permanent redirects if appropriate in production
    }

    location / {
        # 🔥 2) explicitní redirecty na uuid
        if ($redirect_target) {
            return 302 $redirect_target$is_args$args; # Use 301 for permanent redirects if appropriate in production
        }

        # 🔥 3) Angular fallback
        try_files $uri $uri/ /index.html;
    }
}