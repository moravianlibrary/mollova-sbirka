map $uri $redirect_target {
    default "";
    include /etc/nginx/conf.d/redirects.map;
}

server {
    listen 80;
    server_name localhost _;

    root /usr/share/nginx/html;

    # 🔥 1) globální odstranění trailing slash (kromě "/")
    location ~ ^(.+)/$ {
        return 301 $scheme://$host$1$is_args$args;
    }

    location / {
        # 🔥 2) tvoje redirecty
        if ($redirect_target) {
            return 302 $redirect_target$is_args$args;
        }

        # 🔥 3) Angular fallback
        try_files $uri $uri/ /index.html;
    }
}
